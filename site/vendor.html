<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#e9ece8">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <title>Vendor portal — Kompo Nation</title>
</head>
<body class="portal-body" data-portal="vendor">
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="portal-gate" id="portal-gate"><span class="loading-orbit"></span><p>Checking vendor access…</p></div>
  <div class="portal-layout" id="portal-layout" hidden>
    <aside class="portal-sidebar glass">
      <a class="brand" href="./index.html"><span class="brand-mark">KN</span><span>Kompo Nation</span></a>
      <div><small>VENDOR PORTAL</small><strong id="portal-identity">Account</strong></div>
      <nav id="portal-nav" aria-label="Vendor navigation">
        <button class="active" data-view="overview">Overview</button>
        <button data-view="products">Products</button>
        <button data-view="orders">Orders</button>
        <button data-view="returns">Returns</button>
        <button data-view="settings">Store settings</button>
        <!-- VENDOR_ADDITIONAL_INFORMATION_NAV_V2 -->
        <button data-view="information">
          Additional information
        </button>

        <!-- VENDOR_TERMS_LINK_V1 -->
        <a
          class="portal-legal-link"
          href="/terms"
          target="_blank"
          rel="noopener"
        >
          Terms of Service
        </a>
      </nav>
      <div class="portal-sidebar-bottom"><a href="./index.html">Open storefront</a><button id="signout-button">Sign out</button></div>
    </aside>
    <main class="portal-main"><header class="portal-mobile-header glass"><strong>Vendor portal</strong><button id="portal-menu">Menu</button></header><div id="portal-content"></div></main>
  </div>
  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./supabase.js"></script>
  <script src="./portal.js"></script>
</body>
</html>
