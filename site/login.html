<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f1f0ec">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <title>Sign in — Kompo Nation</title>
</head>
<body class="auth-body">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="auth-layout">
    <a class="brand auth-brand" href="./index.html"><span class="brand-mark">KN</span><span>Kompo Nation</span></a>
    <section class="auth-card glass" aria-labelledby="auth-title">
      <div class="auth-intro">
        <p class="eyebrow">YOUR NATION</p>
        <h1 id="auth-title">Welcome back.</h1>
        <p>Sign in to shop, follow orders and manage the areas your account is permitted to use.</p>
      </div>
      <div class="auth-tabs" role="tablist">
        <button class="active" id="signin-tab" type="button">Sign in</button>
        <button id="signup-tab" type="button">Create account</button>
      </div>
      <form id="auth-form" class="stack-form">
        <div id="signup-fields" hidden>
          <label>Full name<input name="fullName" autocomplete="name"></label>
          <label>Phone number<input name="phone" autocomplete="tel" inputmode="tel"></label>
        </div>
        <label>Email address<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <button class="primary-button" id="auth-submit" type="submit">Sign in</button>
        <p id="auth-message" class="form-message" aria-live="polite"></p>
      </form>
      <a class="quiet-link" href="./index.html">← Return to the store</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./supabase.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
